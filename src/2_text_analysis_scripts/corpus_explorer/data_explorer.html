<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CLUU Corpus Explorer</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--ink:#1b1f27;--muted:#667085;--line:#e3e7ec;
 --human:#0F9E84;--hit:#fff2a8}
*{box-sizing:border-box}
body{margin:0;font:15px/1.55 -apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;color:var(--ink);background:var(--bg)}
header{padding:10px 18px;background:var(--card);border-bottom:1px solid var(--line)}
header h1{margin:0;font-size:16px;font-weight:700}
.sub{color:var(--muted);font-size:12px;margin-top:2px}
.controls{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;margin-top:9px}
.controls .grp{display:flex;gap:6px;align-items:center}
.controls .grp b{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-right:2px}
.chip{font-size:12.5px;padding:4px 9px;border:1px solid var(--line);border-radius:999px;background:#fff;cursor:pointer;user-select:none;color:var(--muted)}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.chip.mdl.on{color:#fff}
input[type=search]{flex:1;min-width:220px;padding:8px 11px;border:1px solid var(--line);border-radius:9px;font-size:14px}
.layout{display:grid;grid-template-columns:360px 1fr;height:calc(100vh - 118px)}
.list{overflow:auto;border-right:1px solid var(--line);background:var(--card)}
.item{padding:9px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.item:hover{background:#eef1f4}.item.sel{background:#e6eef8;box-shadow:inset 3px 0 0 #0072B2}
.item .meta{font-size:11px;color:var(--muted);display:flex;gap:8px;margin-bottom:2px}
.item .snip{font-size:13px;color:var(--ink);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.rbadge{font-size:10px;font-weight:700;padding:1px 6px;border-radius:5px;text-transform:uppercase;letter-spacing:.03em}
.r-formal{background:#e7edf6;color:#274b78}.r-informal{background:#f7ede4;color:#8a4a12}
.detail{overflow:auto;padding:18px 24px}
.empty{color:var(--muted);margin-top:40px;text-align:center}
.prompt{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 15px;margin-bottom:14px}
.prompt .k{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:4px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:11px 14px;margin-bottom:12px;white-space:pre-wrap;word-wrap:break-word}
.card.human{border-left:4px solid var(--human)}
.lab{font-size:11.5px;font-weight:700;margin-bottom:7px;display:flex;gap:7px;align-items:center;text-transform:uppercase;letter-spacing:.03em}
.dot{width:9px;height:9px;border-radius:50%;flex:none}
.cond-h{font-size:12px;font-weight:800;color:var(--muted);margin:18px 0 8px;text-transform:uppercase;letter-spacing:.06em;border-bottom:1px solid var(--line);padding-bottom:4px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
.txt{font-size:14px}.txt.blank{color:#b0b7c0;font-style:italic}
mark{background:var(--hit);padding:0 1px;border-radius:2px}
kbd{font:11px monospace;background:#eef1f4;border:1px solid var(--line);border-radius:4px;padding:1px 5px}
</style></head><body>
<header>
  <h1>CLUU Corpus Explorer <span class="sub" id="hdrcount"></span></h1>
  <div class="sub">Human vs model output, side by side, per prompt · <kbd>↑</kbd>/<kbd>↓</kbd> to browse</div>
  <div class="controls">
    <input type="search" id="q" placeholder="Search prompt or any text… (Swedish ok)">
    <div class="grp"><b>Register</b><span class="chip on" data-reg="all">All</span><span class="chip" data-reg="formal">Formal</span><span class="chip" data-reg="informal">Informal</span></div>
    <div class="grp" id="mdls"><b>Models</b></div>
    <div class="grp" id="conds"><b>Conditions</b></div>
  </div>
</header>
<div class="layout">
  <div class="list" id="list"></div>
  <div class="detail" id="detail"><div class="empty">Select a document on the left.</div></div>
</div>
<script src="data_explorer_data.js"></script>
<script>
const META=window.META, DATA=window.CORPUS;
const COND_LAB={baseline:"Baseline",human_like:"Human-like",detector_aware:"Detector-aware",detector_evasive:"Detector-evasive"};
const MCOLOR={"GPT-5.2":"#0072B2","Mistral":"#D55E00","GPT-SW3":"#009E73"};
let reg="all", sel=null, activeModels=new Set(META.models), activeConds=new Set(META.conditions), query="";
// precompute lowercased search blob per doc
DATA.forEach((d,i)=>{d._i=i; let b=[d.prompt,d.human]; for(const m in d.gen) for(const c in d.gen[m]) b.push(d.gen[m][c]); d._blob=b.join(" ␟ ").toLowerCase();});

const esc=s=>(s||"").replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
function hl(s){s=esc(s); if(query){const q=query.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");s=s.replace(new RegExp(q,"gi"),m=>"<mark>"+m+"</mark>");} return s;}

function chips(){
  const md=document.getElementById("mdls");
  META.models.forEach(m=>{const c=document.createElement("span");c.className="chip mdl on";c.textContent=m;
    c.style.setProperty("background",MCOLOR[m]);c.style.borderColor=MCOLOR[m];
    c.onclick=()=>{c.classList.toggle("on");if(c.classList.contains("on")){activeModels.add(m);c.style.background=MCOLOR[m];c.style.color="#fff";c.style.borderColor=MCOLOR[m];}else{activeModels.delete(m);c.style.background="#fff";c.style.color=MCOLOR[m];}render();};
    md.appendChild(c);});
  const cd=document.getElementById("conds");
  META.conditions.forEach(cn=>{const c=document.createElement("span");c.className="chip on";c.textContent=COND_LAB[cn];
    c.onclick=()=>{c.classList.toggle("on");c.classList.contains("on")?activeConds.add(cn):activeConds.delete(cn);render();};
    cd.appendChild(c);});
  document.querySelectorAll("[data-reg]").forEach(el=>el.onclick=()=>{
    document.querySelectorAll("[data-reg]").forEach(x=>x.classList.remove("on"));el.classList.add("on");reg=el.dataset.reg;renderList();});
}
function filtered(){return DATA.filter(d=>(reg==="all"||d.register===reg)&&(!query||d._blob.includes(query.toLowerCase())));}
function renderList(){
  const fl=filtered();const box=document.getElementById("list");box.innerHTML="";
  document.getElementById("hdrcount").textContent="— "+fl.length+" docs (formal "+META.counts.formal+" · informal "+META.counts.informal+")";
  fl.slice(0,3000).forEach(d=>{const it=document.createElement("div");it.className="item"+(sel===d._i?" sel":"");
    it.innerHTML=`<div class="meta"><span class="rbadge r-${d.register}">${d.register}</span><span>#${d.id}</span></div><div class="snip">${hl(d.prompt)}</div>`;
    it.onclick=()=>{sel=d._i;renderList();renderDetail();};box.appendChild(it);});
  if(fl.length>3000){const n=document.createElement("div");n.className="item";n.style.color="#667085";n.textContent="… "+(fl.length-3000)+" more — narrow with search";box.appendChild(n);}
}
function card(cls,label,color,text){
  const blank=!text||!text.trim();
  return `<div class="card ${cls}"><div class="lab">${color?`<span class="dot" style="background:${color}"></span>`:""}${label}</div>`+
    `<div class="txt${blank?' blank':''}">${blank?'(empty)':hl(text)}</div></div>`;
}
function renderDetail(){
  const d=DATA[sel];const det=document.getElementById("detail");
  if(!d){det.innerHTML='<div class="empty">Select a document on the left.</div>';return;}
  let h=`<div class="prompt"><div class="k">Prompt — ${d.register} #${d.id}</div>${hl(d.prompt)}</div>`;
  h+=card("human","Human","#0F9E84",d.human);
  META.conditions.forEach(cn=>{ if(!activeConds.has(cn))return;
    const ms=META.models.filter(m=>activeModels.has(m));
    if(!ms.length)return;
    h+=`<div class="cond-h">${COND_LAB[cn]}</div><div class="grid">`;
    ms.forEach(m=>{h+=card("",m,MCOLOR[m],(d.gen[m]||{})[cn]);});
    h+=`</div>`;
  });
  det.innerHTML=h;det.scrollTop=0;
}
document.getElementById("q").addEventListener("input",e=>{query=e.target.value.trim();renderList();});
document.addEventListener("keydown",e=>{
  if(e.target.tagName==="INPUT")return;
  if(e.key!=="ArrowDown"&&e.key!=="ArrowUp")return;
  const fl=filtered();if(!fl.length)return;e.preventDefault();
  let idx=fl.findIndex(d=>d._i===sel);idx=e.key==="ArrowDown"?Math.min(fl.length-1,idx+1):Math.max(0,idx-1);
  sel=fl[idx]._i;renderList();renderDetail();
  const selEl=document.querySelector(".item.sel");if(selEl)selEl.scrollIntoView({block:"nearest"});
});
chips();renderList();
</script></body></html>
