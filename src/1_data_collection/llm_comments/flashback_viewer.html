<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flashback Textjämförelse</title>
  <style>
    :root {
      --ground:        #ECF0F4;
      --surface:       #FFFFFF;
      --text:          #1B1F26;
      --text-muted:    #7A8494;
      --border:        #D5DCE6;
      --specimen-bg:   #252C38;

      --human-surface: #FDF5EB;
      --human-accent:  #9D5E24;
      --human-badge:   #F2DFC5;

      --ai-surface:    #EDF2FB;
      --ai-accent:     #2B5EA8;
      --ai-badge:      #C8D9F5;

      --mono: ui-monospace, 'Cascadia Code', 'SF Mono', Menlo, Consolas, monospace;
      --serif: Georgia, 'Times New Roman', serif;
      --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--sans);
      background: var(--ground);
      color: var(--text);
      font-size: 14px;
      line-height: 1.5;
    }

    /* ── HEADER ── */
    header {
      background: var(--specimen-bg);
      padding: 14px 24px;
      display: flex;
      align-items: baseline;
      gap: 14px;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header-title {
      font-family: var(--mono);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #FFFFFF;
    }

    .header-sep {
      width: 1px;
      height: 12px;
      background: rgba(255,255,255,0.2);
      flex-shrink: 0;
      align-self: center;
    }

    .header-sub {
      font-size: 12px;
      color: rgba(255,255,255,0.45);
    }

    .header-count {
      margin-left: auto;
      font-family: var(--mono);
      font-size: 11px;
      color: rgba(255,255,255,0.4);
    }

    /* ── CONTROLS ── */
    .controls {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 9px 24px;
      display: flex;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
      position: sticky;
      top: 48px;
      z-index: 99;
    }

    .controls input[type="text"] {
      flex: 1;
      min-width: 220px;
      padding: 6px 13px;
      border: 1px solid var(--border);
      border-radius: 3px;
      font-size: 13px;
      font-family: var(--sans);
      background: var(--ground);
      color: var(--text);
      outline: none;
    }
    .controls input[type="text"]:focus { border-color: var(--ai-accent); }

    .controls label {
      font-size: 11px;
      font-family: var(--mono);
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 5px;
      cursor: pointer;
      white-space: nowrap;
      letter-spacing: 0.04em;
    }

    /* ── FEED ── */
    .feed {
      max-width: 1020px;
      margin: 22px auto;
      padding: 0 16px 64px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    /* ── CARD ── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 4px;
      overflow: hidden;
    }

    /* thin specimen strip */
    .card-meta {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 5px 14px;
      background: var(--specimen-bg);
    }

    .meta-id {
      font-family: var(--mono);
      font-size: 9px;
      letter-spacing: 0.1em;
      color: rgba(255,255,255,0.3);
      flex-shrink: 0;
    }

    .meta-title {
      font-family: var(--mono);
      font-size: 10px;
      color: rgba(255,255,255,0.6);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
    }

    .meta-date {
      font-family: var(--mono);
      font-size: 9px;
      color: rgba(255,255,255,0.28);
      white-space: nowrap;
      flex-shrink: 0;
    }

    /* question area */
    .question-section {
      padding: 15px 18px 14px;
      border-bottom: 1px solid var(--border);
    }

    .question-eyebrow {
      font-family: var(--mono);
      font-size: 8.5px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 7px;
    }

    .question-text {
      font-family: var(--serif);
      font-size: 14px;
      line-height: 1.7;
      color: var(--text);
      white-space: pre-wrap;
      word-break: break-word;
    }

    /* thermal columns — the core aesthetic: warm vs cool surface temperature */
    .comments-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
    }

    .comment-block {
      padding: 13px 18px 16px;
    }

    .comment-block.human {
      background: var(--human-surface);
      border-right: 1px solid var(--border);
    }

    .comment-block.ai {
      background: var(--ai-surface);
    }

    .comment-label {
      font-family: var(--mono);
      font-size: 8.5px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      margin-bottom: 9px;
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .comment-label.human { color: var(--human-accent); }
    .comment-label.ai    { color: var(--ai-accent); }

    .badge {
      font-size: 8px;
      padding: 2px 7px;
      border-radius: 2px;
      font-weight: 700;
      letter-spacing: 0.05em;
    }

    .badge-human { background: var(--human-badge); color: var(--human-accent); }
    .badge-ai    { background: var(--ai-badge);    color: var(--ai-accent); }

    .comment-text {
      font-size: 13.5px;
      line-height: 1.7;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .comment-text.human { color: #2A1E14; }
    .comment-text.ai    { color: #111E30; }

    .empty-ai {
      font-size: 12px;
      color: var(--text-muted);
      font-style: italic;
    }

    mark {
      background: #FFF3C4;
      border-radius: 2px;
      padding: 0 1px;
    }

    /* single-column filter modes */
    .only-human .comments-row  { grid-template-columns: 1fr; }
    .only-human .comment-block.ai { display: none; }
    .only-ai .comments-row    { grid-template-columns: 1fr; }
    .only-ai .comment-block.human { display: none; }

    /* empty / file-picker states */
    .empty {
      text-align: center;
      color: var(--text-muted);
      padding: 60px 20px;
      font-family: var(--mono);
      font-size: 12px;
      letter-spacing: 0.06em;
    }

    .file-prompt {
      text-align: center;
      padding: 80px 20px;
    }

    .file-prompt p {
      color: var(--text-muted);
      font-size: 14px;
      margin-bottom: 20px;
      line-height: 1.65;
    }

    .file-btn {
      display: inline-block;
      background: var(--specimen-bg);
      color: white;
      padding: 10px 22px;
      border-radius: 3px;
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 0.1em;
      font-weight: 700;
      text-transform: uppercase;
      cursor: pointer;
      border: none;
    }

    .file-btn:hover { background: var(--ai-accent); }
    .file-btn:focus-visible { outline: 2px solid var(--ai-accent); outline-offset: 2px; }

    #fileInput { display: none; }

    @media (max-width: 620px) {
      .comments-row { grid-template-columns: 1fr !important; }
      .comment-block.human { border-right: none; border-bottom: 1px solid var(--border); }
      .only-ai .comment-block.human { display: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; animation: none !important; }
    }
  </style>
</head>
<body>

<header>
  <span class="header-title">Flashback</span>
  <span class="header-sep" aria-hidden="true"></span>
  <span class="header-sub">Mänskliga vs. AI-genererade kommentarer</span>
  <span class="header-count" id="count"></span>
</header>

<div class="controls" role="search">
  <input type="text" id="search" placeholder="Sök i frågor eller kommentarer…" aria-label="Sök" />
  <label><input type="checkbox" id="hideAI" /> Dölj AI</label>
  <label><input type="checkbox" id="hideHuman" /> Dölj mänskliga</label>
  <label><input type="checkbox" id="minWords" /> 30+ ord</label>
</div>

<div class="feed" id="feed" aria-live="polite">
  <div class="empty">Laddar…</div>
</div>

<script>
// flashback_ai_comments.csv columns:
// [0] thread_id  [1] thread_title  [2] question  [3] post_date  [4] comment  [5] Generated_OpenAI_Comment

const CSV_FILE = "flashback_ai_comments.csv";

function parseCSV(text) {
  const rows = [];
  let i = 0, n = text.length;
  function field() {
    if (i < n && text[i] === '"') {
      i++;
      let v = "";
      while (i < n) {
        if (text[i] === '"') { i++; if (i < n && text[i] === '"') { v += '"'; i++; } else break; }
        else v += text[i++];
      }
      return v;
    }
    const s = i;
    while (i < n && text[i] !== ',' && text[i] !== '\n' && text[i] !== '\r') i++;
    return text.slice(s, i);
  }
  while (i < n) {
    const row = [];
    while (true) { row.push(field()); if (i < n && text[i] === ',') i++; else break; }
    if (i < n && text[i] === '\r') i++;
    if (i < n && text[i] === '\n') i++;
    rows.push(row);
  }
  return rows;
}

function esc(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function hl(text, q) {
  if (!q) return esc(text);
  const safe = esc(text);
  const re = new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'), 'gi');
  return safe.replace(re, m => `<mark>${m}</mark>`);
}

function wc(s) { return s.trim().split(/\s+/).filter(Boolean).length; }

let allData = [];

function render() {
  const feed = document.getElementById('feed');
  const q = document.getElementById('search').value.trim().toLowerCase();
  const hideAI    = document.getElementById('hideAI').checked;
  const hideHuman = document.getElementById('hideHuman').checked;
  const minWords  = document.getElementById('minWords').checked;

  const filtered = allData.filter(d => {
    if (minWords && wc(d.human) < 30) return false;
    if (!q) return true;
    return d.question.toLowerCase().includes(q)
        || d.human.toLowerCase().includes(q)
        || d.ai.toLowerCase().includes(q)
        || d.title.toLowerCase().includes(q);
  });

  document.getElementById('count').textContent = `${filtered.length} / ${allData.length}`;

  if (filtered.length === 0) {
    feed.innerHTML = '<div class="empty">Inga matchande rader.</div>';
    return;
  }

  const modeClass = (hideAI && !hideHuman) ? 'only-human' : (!hideAI && hideHuman) ? 'only-ai' : '';
  feed.className = 'feed' + (modeClass ? ' ' + modeClass : '');

  feed.innerHTML = filtered.map(d => {
    const humanBlock = !hideHuman ? `
      <div class="comment-block human">
        <div class="comment-label human"><span class="badge badge-human">Människa</span></div>
        <div class="comment-text human">${hl(d.human, q)}</div>
      </div>` : '';

    const aiBlock = !hideAI ? `
      <div class="comment-block ai">
        <div class="comment-label ai"><span class="badge badge-ai">AI · GPT-4o mini</span></div>
        <div class="comment-text ai">${d.ai ? hl(d.ai, q) : '<span class="empty-ai">Ej genererat</span>'}</div>
      </div>` : '';

    return `
      <div class="card">
        <div class="card-meta">
          <span class="meta-id">ID ${esc(d.threadId)}</span>
          <span class="meta-title">${esc(d.title)}</span>
          <span class="meta-date">${esc(d.date)}</span>
        </div>
        <div class="question-section">
          <div class="question-eyebrow">Ursprunglig fråga</div>
          <div class="question-text">${hl(d.question, q)}</div>
        </div>
        <div class="comments-row">${humanBlock}${aiBlock}</div>
      </div>`;
  }).join('');
}

function loadText(text) {
  const rows = parseCSV(text);
  allData = rows.slice(1)
    .filter(r => r.length >= 5)
    .map((r, i) => ({
      index: i + 1,
      threadId: r[0].trim(),
      title:    r[1].trim(),
      question: r[2].trim(),
      date:     r[3].trim(),
      human:    r[4].trim(),
      ai:       r.length >= 6 ? r[5].trim() : '',
    }));

  ['search','hideAI','hideHuman','minWords'].forEach(id => {
    const el = document.getElementById(id);
    el.addEventListener('input', render);
    el.addEventListener('change', render);
  });
  render();
}

function showFilePicker() {
  document.getElementById('feed').innerHTML = `
    <div class="file-prompt">
      <p>Öppna <strong>flashback_ai_comments.csv</strong><br>för att läsa in data.</p>
      <label class="file-btn" for="fileInput">Öppna CSV-fil</label>
      <input type="file" id="fileInput" accept=".csv" />
    </div>`;
  document.getElementById('fileInput').addEventListener('change', e => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => loadText(ev.target.result);
    reader.readAsText(file, 'UTF-8');
  });
}

async function init() {
  try {
    const resp = await fetch(CSV_FILE);
    if (!resp.ok) throw new Error();
    loadText(await resp.text());
  } catch {
    showFilePicker();
  }
}

init();
</script>
</body>
</html>
