# Reruns the Experiment 2 embedding classifier (tab:embedding-auc, computed on the
# document-matched GPT-5.6 quiz subset) with source-grouped cross-validation:
# StratifiedGroupKFold by title (formal) / question thread (informal).
#
# Step 1 reproduces the published ungrouped AUCs as a self-check and restores the
# committed CSV afterwards; step 2 writes the grouped results, which are committed
# back to the branch together with the reproduction check.
name: grouped-cv

on:
  workflow_dispatch:
  push:
    branches: [thesis-revisions-exp3]
    paths: [.github/workflows/grouped-cv.yml]

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install sentence-transformers scikit-learn pandas numpy

      - name: Reproduce the published (ungrouped) AUCs
        run: |
          set -e
          D=src/2_text_analysis_scripts/csv_files
          cp $D/embedding_auc_matched_gpt56subset.csv /tmp/published.csv
          python src/2_text_analysis_scripts/scripts/matched_auc_control.py
          python - <<'EOF'
          import pandas as pd
          pub = pd.read_csv("/tmp/published.csv")
          new = pd.read_csv("src/2_text_analysis_scripts/csv_files/embedding_auc_matched_gpt56subset.csv")
          k = ["generator", "register", "condition"]
          m = pub[k + ["matched_cv_roc_auc"]].merge(
              new[k + ["matched_cv_roc_auc"]], on=k, suffixes=("_published", "_rerun"))
          m["diff"] = (m.matched_cv_roc_auc_rerun - m.matched_cv_roc_auc_published).round(4)
          print(m.to_string(index=False))
          m.to_csv("/tmp/embedding_auc_matched_rerun_check.csv", index=False)
          EOF
          cp /tmp/published.csv $D/embedding_auc_matched_gpt56subset.csv
          cp /tmp/embedding_auc_matched_rerun_check.csv $D/

      - name: Grouped cross-validation on the matched subset
        run: python src/2_text_analysis_scripts/scripts/matched_auc_control.py --permutations 1000 --group-cv

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/2_text_analysis_scripts/csv_files/embedding_auc_matched_gpt56subset_grouped.csv \
                  src/2_text_analysis_scripts/csv_files/embedding_auc_matched_rerun_check.csv
          git commit -m "Add source-grouped embedding classifier results (CI run)"
          git pull --rebase origin thesis-revisions-exp3
          git push
